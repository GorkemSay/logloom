name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Configure (debug-asan)
        run: cmake --preset debug-asan

      - name: Build (debug-asan)
        run: cmake --build --preset debug-asan

      - name: Test (debug-asan)
        run: ctest --preset debug-asan --output-on-failure

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

      - name: Test (release)
        run: ctest --preset release --output-on-failure

      - name: CLI smoke check
        run: ./build/release/cli/logloom --version

      - name: Build & test macOS SwiftPM package
        if: runner.os == 'macOS'
        run: |
          swift test --package-path macos
          ./macos/scripts/bundle_app.sh
